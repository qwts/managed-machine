# Go core evidence (ADR-0016 F03, ADR-0017). Every change to core/ or to this
# workflow is vetted and tested on the five first-release targets of ADR-0014,
# each on its native hosted runner; a cross-built or emulated run is not
# evidence. The platform probe's output is compared with the identifier the
# runner is known to be, so a mislabeled or emulated runner fails the job.
name: Go core

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/go-core.yml'
      # The F08 gate re-runs the F01 goldens, so a change to a legacy route
      # or its harness runs the gate too.
      - 'bin/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/go-core.yml'
      - 'bin/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-core-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  core:
    name: core (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin/arm64
            os: darwin
            arch: arm64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            os: linux
            arch: arm64
          - runner: ubuntu-24.04
            target: linux/amd64
            os: linux
            arch: amd64
          - runner: windows-11-arm
            target: windows/arm64
            os: windows
            arch: arm64
          - runner: windows-2025
            target: windows/amd64
            os: windows
            arch: amd64
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - name: Check out the merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Install the pinned Node toolchain
        # The provider gate installs an npm package, so the runner needs a
        # node it can rely on. The action is pinned by commit, like every
        # other action of this workflow.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Toolchain matches core/go.mod
        run: |
          want="go$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)"
          got="$(go version | awk '{print $3}')"
          echo "go.mod wants $want, runner has $got"
          test "$got" = "$want"
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build the native binary
        run: go build -o ./managed-machine-core ./cmd/managed-machine
      - name: Native platform probe reports ${{ matrix.target }} without emulation
        run: |
          code=0; out="$(./managed-machine-core platform 2>err.txt)" || code=$?
          echo "stdout: $out"; echo "stderr: $(cat err.txt)"
          test "$code" -eq 0
          test -z "$(cat err.txt)"
          test "$out" = '{"platform":"${{ matrix.target }}","os":"${{ matrix.os }}","arch":"${{ matrix.arch }}","emulated":false}'
      - name: Presentation flags and help behave per contract
        run: |
          # The runner's bash runs with -e, so an intended non-zero exit is
          # captured with || rather than $? on the next statement.
          code=0; ./managed-machine-core platform --json --human >out.txt 2>err.txt || code=$?
          test "$code" -eq 2 && test ! -s out.txt
          test "$(cat err.txt)" = '{"diagnostic":"MM_USAGE","message":"--json and --human are mutually exclusive"}'
          code=0; ./managed-machine-core platform --json --human -h >out.txt 2>err.txt || code=$?
          test "$code" -eq 0 && test ! -s err.txt && head -1 out.txt | grep -q '^Usage: managed-machine platform'
      - name: F01 compatibility goldens through the legacy routes (macOS)
        # Compatibility B keeps the legacy Bash routes on macOS only; the
        # other targets record the comparison as not applicable.
        if: matrix.os == 'darwin'
        working-directory: .
        run: |
          bash tests/host-state-characterization.test.sh | tee f01-compat.txt
          bash tests/catalog-characterization.test.sh | tee -a f01-compat.txt
      - name: F08 first-slice walkthrough (T01-T05 evidence for ${{ matrix.target }})
        run: |
          # Windows starts executables by extension, so the probed binary is
          # copied byte for byte under its .exe name.
          bin=./managed-machine-core; exe="$(go env GOEXE)"
          if [ -n "$exe" ]; then cp "$bin" "$bin$exe"; bin="$bin$exe"; fi
          compat=(); [ -f ../f01-compat.txt ] && compat=(-compat ../f01-compat.txt)
          go build -o ./mm-walkthrough ./cmd/mm-walkthrough
          ./mm-walkthrough run -binary "$bin" -target '${{ matrix.target }}' \
            -source-revision '${{ github.sha }}' -evidence "walkthrough-${{ matrix.os }}-${{ matrix.arch }}.json" \
            ${compat[@]+"${compat[@]}"}
      - name: Attach the walkthrough evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walkthrough-${{ matrix.os }}-${{ matrix.arch }}
          path: core/walkthrough-${{ matrix.os }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

      - name: S2 install gate (E05 evidence for ${{ matrix.target }})
        run: |
          # Real installs happen only here, on the hosted runner: the gate
          # refuses brew mode anywhere else.
          bin=./managed-machine-core; exe="$(go env GOEXE)"
          if [ -n "$exe" ]; then bin="$bin$exe"; fi
          ./mm-walkthrough install -binary "$bin" -target '${{ matrix.target }}' \
            -source-revision '${{ github.sha }}' -evidence "install-gate-${{ matrix.os }}-${{ matrix.arch }}.json"
      - name: Attach the install gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-gate-${{ matrix.os }}-${{ matrix.arch }}
          path: core/install-gate-${{ matrix.os }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Toolchains for the S3 provider gate
        run: |
          # The provider gate installs with uv and with cargo, so the runner
          # needs both. A toolchain that is already there is used as it is;
          # only a missing one is installed, and it is installed pinned.
          if ! command -v uv >/dev/null 2>&1; then
            pipx install uv==0.13.4
          fi
          # pipx installs into its own bin directory, which is not on the
          # PATH of every image.
          uv_bin="$(pipx environment --value PIPX_BIN_DIR 2>/dev/null || true)"
          if [ -n "$uv_bin" ]; then echo "$uv_bin" >> "$GITHUB_PATH"; fi
          if [ "${{ matrix.runner }}" = "windows-11-arm" ] && ! command -v cargo >/dev/null 2>&1; then
            # The windows-11-arm image has no Rust toolchain. The official
            # installer for the target is used, with the minimal profile.
            curl -fsSL -o rustup-init.exe \
              https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain stable
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          fi
      - name: WinGet for the S3 provider gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The windows-11-arm image ships no WinGet. Only a missing one is
          # installed, through Microsoft's own module, pinned.
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PSResource -Name Microsoft.WinGet.Client -Version 1.29.380 -Scope CurrentUser -Repository PSGallery -TrustRepository
            Import-Module Microsoft.WinGet.Client
            Repair-WinGetPackageManager -Latest -Force
            "$env:LOCALAPPDATA\Microsoft\WindowsApps" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          winget --version
      - name: S3 provider gate (X07 evidence for ${{ matrix.target }})
        run: |
          # Real installs happen only here, on the hosted runner: the gate
          # refuses to install anywhere else.
          bin=./managed-machine-core; exe="$(go env GOEXE)"
          if [ -n "$exe" ]; then bin="$bin$exe"; fi
          ./mm-walkthrough providers -binary "$bin" -target '${{ matrix.target }}' \
            -source-revision '${{ github.sha }}' -evidence "provider-gate-${{ matrix.os }}-${{ matrix.arch }}.json"
      - name: Attach the provider gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-gate-${{ matrix.os }}-${{ matrix.arch }}
          path: core/provider-gate-${{ matrix.os }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

  first-slice-gate:
    # S1 completes only when all five targets passed the same walkthrough on
    # the same source revision (migration plan F08, ADR-0017).
    name: first-slice gate (F08)
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - name: Check out the merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Collect the five evidence records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: walkthrough-*
          path: evidence
          merge-multiple: true
      - name: Five targets, one revision, identical portable output
        run: |
          go run ./cmd/mm-walkthrough aggregate -source-revision '${{ github.sha }}' ../evidence/*.json | tee -a "$GITHUB_STEP_SUMMARY"

  s2-gate:
    # S2 completes only when all five targets ran the install gate on the
    # same source revision, with real installs on macOS (migration plan S2).
    name: S2 install gate (E05)
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - name: Check out the merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Collect the five install gate records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: install-gate-*
          path: evidence
          merge-multiple: true
      - name: Five targets, one revision, real macOS installs
        run: |
          go run ./cmd/mm-walkthrough install-aggregate -source-revision '${{ github.sha }}' ../evidence/*.json | tee -a "$GITHUB_STEP_SUMMARY"

  s3-gate:
    # S3 completes only when all five targets ran the provider gate on the
    # same source revision and every provider combination passed (migration
    # plan S3).
    name: S3 provider gate (X07)
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - name: Check out the merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Collect the five provider gate records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: provider-gate-*
          path: evidence
          merge-multiple: true
      - name: Five targets, one revision, every provider combination
        run: |
          go run ./cmd/mm-walkthrough providers-aggregate -source-revision '${{ github.sha }}' ../evidence/*.json | tee -a "$GITHUB_STEP_SUMMARY"
