schema_version: 1
id: git
description: Distributed version control.
categories: [devtools, vcs]
recipes:
  - id: homebrew
    provider: brew
    package: git
    platforms: [darwin/arm64, linux/arm64, linux/amd64]
    targets: [global, user]
    requires: []
    options:
      formula: git
  - id: winget
    provider: winget
    package: Git.Git
    platforms: [windows/arm64, windows/amd64]
    targets: [global, user]
    requires: []
    options:
      package_id: Git.Git
