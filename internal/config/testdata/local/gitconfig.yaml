kind: config
schema_version: 1
id: gitconfig
description: Configure git for the current account.
categories: [vcs]
platforms: [darwin/arm64, linux/arm64, linux/amd64]
targets: [global, user, custom]
operations:
  - id: config
    provider: template
    destination: gitconfig
    source: templates/gitconfig.tmpl
    settings:
      name: Managed Machine
